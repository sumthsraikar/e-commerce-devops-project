apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-service
  namespace: prod
spec:

  selector:
    matchLabels:
      app: search-service
  template:
    metadata:
      labels:
        app: search-service
    spec:
      containers:
        - name: search-service
          image: sumithsraikar/e-commerce-devops-project:search-service-3f2322097b5adb78797ec2e115dba2278aef0456
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5002
          resources:
            requests:
              cpu: "100m"
              memory: "100Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 15
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: search-service
  namespace: prod
spec:
  type: ClusterIP
  selector:
    app: search-service
  ports:
    - port: 5002
      targetPort: 5002
      protocol: TCP



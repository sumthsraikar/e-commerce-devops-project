apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: prod
spec:
  
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: sumithsraikar/e-commerce-devops-project:order-service-v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5004
          resources:
            requests:
              cpu: "100m"
              memory: "100Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: prod
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
    - port: 5004
      targetPort: 5004
      protocol: TCP



apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-service
  namespace: prod
spec:

  selector:
    matchLabels:
      app: cart-service
  template:
    metadata:
      labels:
        app: cart-service
    spec:
      containers:
        - name: cart-service
          image: sumithsraikar/e-commerce-devops-project:cart-service-3f2322097b5adb78797ec2e115dba2278aef0456
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5003
          resources:
            requests:
              cpu: "100m"
              memory: "100Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 5003
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5003
            initialDelaySeconds: 15
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: cart-service
  namespace: prod
spec:
  type: ClusterIP
  selector:
    app: cart-service
  ports:
    - port: 5003
      targetPort: 5003
      protocol: TCP



apiVersion: apps/v1
kind: Deployment
metadata:
  name: wishlist-service
  namespace: prod
spec:
  selector:
    matchLabels:
      app: wishlist-service
  template:
    metadata:
      labels:
        app: wishlist-service
    spec:
      containers:
        - name: wishlist-service
          image: sumithsraikar/e-commerce-devops-project:wishlist-service-f36529f9703b29ce59c8b7236f7925e23ad03916
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5005
          resources:
            requests:
              cpu: "100m"
              memory: "100Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 5005
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5005
            initialDelaySeconds: 15
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: wishlist-service
  namespace: prod
spec:
  type: ClusterIP
  selector:
    app: wishlist-service
  ports:
    - port: 5005
      targetPort: 5005
      protocol: TCP



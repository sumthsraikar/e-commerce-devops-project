apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  namespace: prod
spec:

  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
    spec:
      containers:
        - name: catalog-service
          image: sumithsraikar/e-commerce-devops-project:catalog-service-v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001
          resources:
            requests:
              cpu: "100m"
              memory: "100Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 15
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  namespace: prod
spec:
  type: ClusterIP
  selector:
    app: catalog-service
  ports:
    - port: 5001
      targetPort: 5001
      protocol: TCP



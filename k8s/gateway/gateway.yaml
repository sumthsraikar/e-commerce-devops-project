apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-api
  namespace: prod
spec:

  selector:
    matchLabels:
      app: gateway-api
  template:
    metadata:
      labels:
        app: gateway-api
    spec:
      containers:
        - name: gateway-api
          image: sumithsraikar/e-commerce-devops-project:api-gateway-v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: gateway-config
          resources:
            requests:
              cpu: "100m"
              memory: "100Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: gateway-api
  namespace: prod
spec:
  type: ClusterIP
  selector:
    app: gateway-api
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP



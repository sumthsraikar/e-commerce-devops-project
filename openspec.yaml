openapi: 3.0.3
info:
  title: Flipkart E-Commerce Microservices OpenSpec
  description: |
    # Flipkart Microservices API & Container Architecture Specification (OpenSpec)
    
    This specification outlines the complete API contracts, microservice boundaries, container network topology, and health observability for the Flipkart Microservices ecosystem.
    
    ### Microservices & Container Topology:
    | Container / Service | Port | Base Image | Role & Responsibilities |
    | :--- | :---: | :--- | :--- |
    | **Frontend Storefront** | `80` | `nginx:alpine` | Serves web assets (`index.html`, `styles.css`, `app.js`, `images/`) |
    | **API Gateway** | `8000` | `node:22-alpine` | Reverse proxy routing `/api/v1/*` requests & aggregated `/health` |
    | **Catalog Service** | `5001` | `node:22-alpine` | Products discovery, category taxonomy, brand filtering, and specs |
    | **Search Service** | `5002` | `node:22-alpine` | Full-text keyword matching and live auto-complete suggestions |
    | **Cart Service** | `5003` | `node:22-alpine` | In-memory shopping cart operations, quantity updates, and pricing engine |
    | **Order Service** | `5004` | `node:22-alpine` | Order placement, automated tracking ID generation, and order cancellation |
    | **Wishlist Service** | `5005` | `node:22-alpine` | User favorites toggle and saved items management |
  version: 1.0.0
  contact:
    name: DevOps & Engineering Team
    url: https://github.com/sumthsraikar/e-commerce-devops-project
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8000
    description: API Gateway & Reverse Proxy (Unified Entrypoint)
  - url: http://localhost:80
    description: Frontend Web Storefront (Nginx Container)
  - url: http://localhost:5001
    description: Catalog Microservice (Direct Container)
  - url: http://localhost:5002
    description: Search Microservice (Direct Container)
  - url: http://localhost:5003
    description: Cart Microservice (Direct Container)
  - url: http://localhost:5004
    description: Order Microservice (Direct Container)
  - url: http://localhost:5005
    description: Wishlist Microservice (Direct Container)

tags:
  - name: Static & Web Storefront
    description: Web assets, single page application entrypoint, and delivery
  - name: System & Observability
    description: Aggregated gateway and individual microservice health probes
  - name: Catalog & Products
    description: Product discovery, filtering, categories, and brand metadata
  - name: Search & Autocomplete
    description: Keyword search queries and live search suggestions
  - name: Shopping Cart
    description: In-memory shopping cart operations, item manipulation, and price calculations
  - name: Orders & Checkout
    description: Order placement, delivery tracking, and cancellations
  - name: Wishlist
    description: User favorites and saved items toggles

paths:
  # ==========================================
  # STATIC & WEB STOREFRONT
  # ==========================================
  /:
    get:
      tags:
        - Static & Web Storefront
      summary: Root Web Storefront (Nginx :80)
      description: Serves the primary Flipkart storefront web application (HTML, CSS, JS).
      operationId: getStorefront
      responses:
        '200':
          description: HTML page rendered successfully
          content:
            text/html:
              schema:
                type: string

  # ==========================================
  # SYSTEM & OBSERVABILITY
  # ==========================================
  /health:
    get:
      tags:
        - System & Observability
      summary: Aggregated Health Check
      description: Returns health status of the API Gateway and pings all 5 downstream microservices.
      operationId: getSystemHealth
      responses:
        '200':
          description: All microservices are healthy and operational
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayHealthResponse'
        '207':
          description: Multi-status - one or more downstream microservices are unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayHealthResponse'

  # ==========================================
  # CATALOG & PRODUCTS SERVICE
  # ==========================================
  /api/v1/products:
    get:
      tags:
        - Catalog & Products
      summary: List and Filter Products
      description: Retrieve catalog products with optional filters for category, brands, price range, rating, and sorting.
      operationId: listProducts
      parameters:
        - name: category
          in: query
          description: Filter products by category (e.g., Mobiles, Electronics, Audio, Appliances, Fashion)
          schema:
            type: string
            example: Mobiles
        - name: brands
          in: query
          description: Comma-separated list of brands to filter (e.g., Apple, Samsung, Sony)
          schema:
            type: string
            example: Apple,Samsung
        - name: minPrice
          in: query
          description: Minimum product price in INR
          schema:
            type: number
            example: 10000
        - name: maxPrice
          in: query
          description: Maximum product price in INR
          schema:
            type: number
            example: 150000
        - name: minRating
          in: query
          description: Minimum customer rating (1 to 5)
          schema:
            type: number
            example: 4.0
        - name: assured
          in: query
          description: Filter only Flipkart Assured products
          schema:
            type: boolean
            example: true
        - name: sortBy
          in: query
          description: Sorting strategy
          schema:
            type: string
            enum: [relevance, price_asc, price_desc, rating, discount]
            example: price_asc
      responses:
        '200':
          description: Products retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'

  /api/v1/products/{id}:
    get:
      tags:
        - Catalog & Products
      summary: Get Product by ID
      description: Retrieve complete details and technical specifications for a single product.
      operationId: getProductById
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric identifier of the product
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Product details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  product:
                    $ref: '#/components/schemas/Product'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/categories:
    get:
      tags:
        - Catalog & Products
      summary: List Categories
      description: Retrieve list of all available product categories along with item counts.
      operationId: listCategories
      responses:
        '200':
          description: Categories retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  count:
                    type: integer
                    example: 5
                  categories:
                    type: array
                    items:
                      $ref: '#/components/schemas/CategoryItem'

  /api/v1/brands:
    get:
      tags:
        - Catalog & Products
      summary: List Brands
      description: Retrieve unique product brands available in the catalog.
      operationId: listBrands
      responses:
        '200':
          description: Brands retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  count:
                    type: integer
                    example: 8
                  brands:
                    type: array
                    items:
                      type: string
                    example: ["Apple", "ASUS", "boAt", "Fastrack", "LG", "Nike", "Realme", "Samsung", "Sony"]

  # ==========================================
  # SEARCH & AUTOCOMPLETE SERVICE
  # ==========================================
  /api/v1/search:
    get:
      tags:
        - Search & Autocomplete
      summary: Search Products
      description: Search products across title, brand, category, and specifications.
      operationId: searchProducts
      parameters:
        - name: q
          in: query
          required: true
          description: Search keywords
          schema:
            type: string
            example: iphone 15
      responses:
        '200':
          description: Search results retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  query:
                    type: string
                    example: iphone 15
                  total:
                    type: integer
                    example: 1
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'

  /api/v1/search/suggestions:
    get:
      tags:
        - Search & Autocomplete
      summary: Auto-complete Search Suggestions
      description: Get live keyword suggestions matching the prefix/substring query.
      operationId: getSearchSuggestions
      parameters:
        - name: q
          in: query
          required: true
          description: Query prefix
          schema:
            type: string
            example: sam
      responses:
        '200':
          description: Suggestions retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  query:
                    type: string
                    example: sam
                  suggestions:
                    type: array
                    items:
                      type: string
                    example: ["Samsung Galaxy S24 Ultra 5G", "Samsung 236L Refrigerator", "Samsung"]

  # ==========================================
  # SHOPPING CART SERVICE
  # ==========================================
  /api/v1/cart:
    get:
      tags:
        - Shopping Cart
      summary: Get Shopping Cart
      description: Retrieve current cart items, calculated MRP total, discount, and final payable amount.
      operationId: getCart
      responses:
        '200':
          description: Cart retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  cart:
                    $ref: '#/components/schemas/CartCalculation'

  /api/v1/cart/items:
    post:
      tags:
        - Shopping Cart
      summary: Add Item to Cart
      description: Add a product to the cart or increment its quantity if already present.
      operationId: addToCart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddToCartRequest'
      responses:
        '200':
          description: Item added to cart successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Item added to cart
                  cart:
                    $ref: '#/components/schemas/CartCalculation'
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/cart/items/{productId}:
    put:
      tags:
        - Shopping Cart
      summary: Update Item Quantity
      description: Update the quantity of a specific product in the cart (0 removes item).
      operationId: updateCartItem
      parameters:
        - name: productId
          in: path
          required: true
          description: ID of product to update
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity:
                  type: integer
                  minimum: 0
                  example: 2
      responses:
        '200':
          description: Cart item updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Cart item updated
                  cart:
                    $ref: '#/components/schemas/CartCalculation'
        '404':
          description: Item not in cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Shopping Cart
      summary: Remove Item from Cart
      description: Delete a specific item from the shopping cart.
      operationId: removeCartItem
      parameters:
        - name: productId
          in: path
          required: true
          description: ID of product to remove
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Item removed from cart successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Item removed from cart
                  cart:
                    $ref: '#/components/schemas/CartCalculation'

  /api/v1/cart/clear:
    delete:
      tags:
        - Shopping Cart
      summary: Clear Cart
      description: Remove all items from the shopping cart.
      operationId: clearCart
      responses:
        '200':
          description: Cart cleared successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Cart cleared successfully
                  cart:
                    $ref: '#/components/schemas/CartCalculation'

  # ==========================================
  # ORDERS & CHECKOUT SERVICE
  # ==========================================
  /api/v1/orders:
    get:
      tags:
        - Orders & Checkout
      summary: List Orders
      description: Retrieve placed orders and order history.
      operationId: listOrders
      responses:
        '200':
          description: Orders retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  total:
                    type: integer
                    example: 1
                  orders:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'

    post:
      tags:
        - Orders & Checkout
      summary: Place New Order
      description: Submit an order with cart items, shipping address, and payment method.
      operationId: placeOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
      responses:
        '201':
          description: Order created and confirmed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Order placed successfully!
                  order:
                    $ref: '#/components/schemas/Order'
        '400':
          description: Bad request (e.g., empty items)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/orders/{orderId}:
    get:
      tags:
        - Orders & Checkout
      summary: Get Order Details
      description: Retrieve details and delivery tracking status for a specific Order ID.
      operationId: getOrderById
      parameters:
        - name: orderId
          in: path
          required: true
          description: Unique Order identifier (e.g., ODR-98231024)
          schema:
            type: string
            example: ODR-98231024
      responses:
        '200':
          description: Order retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  order:
                    $ref: '#/components/schemas/Order'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/orders/{orderId}/cancel:
    delete:
      tags:
        - Orders & Checkout
      summary: Cancel Order
      description: Cancel a previously placed order.
      operationId: cancelOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            example: ODR-98231024
      responses:
        '200':
          description: Order cancelled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Order ODR-98231024 has been cancelled
                  order:
                    $ref: '#/components/schemas/Order'

  # ==========================================
  # WISHLIST SERVICE
  # ==========================================
  /api/v1/wishlist:
    get:
      tags:
        - Wishlist
      summary: Get Wishlist Items
      description: Retrieve all saved items in the user's wishlist.
      operationId: getWishlist
      responses:
        '200':
          description: Wishlist retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  count:
                    type: integer
                    example: 2
                  wishlist:
                    type: array
                    items:
                      type: object

  /api/v1/wishlist/toggle:
    post:
      tags:
        - Wishlist
      summary: Toggle Item in Wishlist
      description: Adds item if not in wishlist, removes if already present.
      operationId: toggleWishlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId]
              properties:
                productId:
                  type: integer
                  example: 1
                product:
                  $ref: '#/components/schemas/Product'
      responses:
        '200':
          description: Item toggled in wishlist
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  action:
                    type: string
                    enum: [added, removed]
                    example: added
                  count:
                    type: integer
                    example: 1
                  wishlist:
                    type: array
                    items:
                      type: object

  /api/v1/wishlist/{productId}:
    delete:
      tags:
        - Wishlist
      summary: Remove from Wishlist
      description: Remove a product from the wishlist by product ID.
      operationId: removeWishlist
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Removed from wishlist
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Product 1 removed from wishlist
                  count:
                    type: integer
                    example: 0
                  wishlist:
                    type: array
                    items:
                      type: object

# ==========================================
# REUSABLE COMPONENTS & SCHEMAS
# ==========================================
components:
  schemas:
    Product:
      type: object
      required: [id, title, brand, category, price, mrp, rating, ratingCount, assured, image]
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: Apple iPhone 15 Pro (128 GB) - Natural Titanium
        brand:
          type: string
          example: Apple
        category:
          type: string
          example: Mobiles
        price:
          type: number
          example: 127990
        mrp:
          type: number
          example: 134900
        rating:
          type: number
          example: 4.7
        ratingCount:
          type: integer
          example: 14230
        assured:
          type: boolean
          example: true
        image:
          type: string
          format: uri
          example: https://images.unsplash.com/photo-1695048133142-1a20484d2569?w=500
        specs:
          type: array
          items:
            type: string
          example: ["128 GB ROM", "15.49 cm Super Retina XDR Display", "A17 Pro Chip"]
        highlights:
          type: array
          items:
            type: string
          example: ["Grade 5 Titanium design", "USB-C support"]

    ProductListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        total:
          type: integer
          example: 14
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'

    CategoryItem:
      type: object
      properties:
        name:
          type: string
          example: Mobiles
        count:
          type: integer
          example: 3

    CartItem:
      type: object
      required: [productId, title, price, qty]
      properties:
        id:
          type: integer
          example: 1
        productId:
          type: integer
          example: 1
        title:
          type: string
          example: Apple iPhone 15 Pro (128 GB)
        price:
          type: number
          example: 127990
        mrp:
          type: number
          example: 134900
        image:
          type: string
          example: https://images.unsplash.com/photo-1695048133142-1a20484d2569?w=500
        qty:
          type: integer
          example: 1

    AddToCartRequest:
      type: object
      required: [productId]
      properties:
        productId:
          type: integer
          example: 1
        title:
          type: string
          example: Apple iPhone 15 Pro (128 GB)
        price:
          type: number
          example: 127990
        mrp:
          type: number
          example: 134900
        image:
          type: string
          example: https://images.unsplash.com/photo-1695048133142-1a20484d2569?w=500
        quantity:
          type: integer
          default: 1
          example: 1

    CartCalculation:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        itemCount:
          type: integer
          example: 1
        totalMrp:
          type: number
          example: 134900
        totalPrice:
          type: number
          example: 127990
        totalDiscount:
          type: number
          example: 6910
        deliveryCharge:
          type: number
          example: 0

    Order:
      type: object
      properties:
        orderId:
          type: string
          example: ODR-98231024
        orderDate:
          type: string
          format: date-time
          example: "2026-08-15T01:00:00.000Z"
        status:
          type: string
          enum: [Confirmed, Packed, Shipped, Delivered, Cancelled]
          example: Confirmed
        paymentMethod:
          type: string
          example: UPI / PhonePe
        shippingAddress:
          type: string
          example: B-402, Sunset Heights, Bangalore, Karnataka - 560100
        totalAmount:
          type: number
          example: 127990
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        deliveryDate:
          type: string
          example: Estimated by Sun, Aug 18

    OrderCreateRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        totalAmount:
          type: number
          example: 127990
        shippingAddress:
          type: string
          example: Flat 402, Sea Crest Apartments, Marine Drive, Mumbai - 400001
        paymentMethod:
          type: string
          example: UPI

    GatewayHealthResponse:
      type: object
      properties:
        gateway:
          type: string
          example: UP
        port:
          type: integer
          example: 8000
        timestamp:
          type: string
          format: date-time
        allServicesOperational:
          type: boolean
          example: true
        services:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                example: catalog-service
              status:
                type: string
                example: UP
              details:
                type: object

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: Resource not found
        message:
          type: string
          example: The requested resource does not exist
